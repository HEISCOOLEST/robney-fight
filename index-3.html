<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ROBNEY FIGHT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lobby">
  <h1>⚔ ROBNEY FIGHT</h1>
  <p>READ • PUNISH • DOMINATE</p>
  <div class="lobbyCard">
    <input id="playerName" type="text" maxlength="15" placeholder="Your fighter name">
    <button id="createRoom">CREATE ROOM</button>
    <div class="or">OR</div>
    <input id="roomCode" type="text" maxlength="6" placeholder="Room code">
    <button id="joinRoom">JOIN ROOM</button>
    <div id="status"></div>
  </div>
</div>

<div id="rotatePrompt" class="hidden">
  <div class="icon">📱</div>
  <p>Rotate your device to landscape to fight</p>
</div>

<div id="gameScreen" class="hidden">
  <div id="roomPanel">ROOM: <strong id="liveRoomCode">------</strong> <button id="copyRoom">COPY</button></div>
  <button id="fullscreenBtn" aria-label="Toggle fullscreen">
    <svg class="iconExpand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <svg class="iconCompress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4a2 2 0 0 1-2 2H3M15 3v4a2 2 0 0 0 2 2h4M9 21v-4a2 2 0 0 0-2-2H3M15 21v-4a2 2 0 0 1 2-2h4"/></svg>
  </button>

  <canvas id="gameCanvas"></canvas>

  <div class="topBar">
    <div class="fighterInfo">
      <span id="p1Name">PLAYER 1</span>
      <div class="healthBar"><div id="p1Health"></div></div>
      <div class="momentumBar" id="p1MomentumWrap"><div id="p1Momentum"></div></div>
    </div>
    <div class="timer" id="timer">75</div>
    <div class="fighterInfo right">
      <span id="p2Name">PLAYER 2</span>
      <div class="healthBar"><div id="p2Health"></div></div>
      <div class="momentumBar" id="p2MomentumWrap"><div id="p2Momentum"></div></div>
    </div>
  </div>

  <div id="comboFx"></div>

  <div class="controls">
    <div class="pad">
      <button id="left" aria-label="Move left">◀</button>
      <button id="jump" aria-label="Jump">▲</button>
      <button id="right" aria-label="Move right">▶</button>
      <button id="dash" aria-label="Dash">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h9M8 7l5 5-5 5M15 7l5 5-5 5"/></svg>
      </button>
    </div>

    <div class="specials">
      <button class="specialBtn" id="overdrive">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-7l0-6z"/></svg>
        OVERDRIVE
      </button>
      <button class="specialBtn" id="fatality">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="9" cy="10" r="1.6"/><circle cx="15" cy="10" r="1.6"/><path d="M12 3a7 7 0 0 0-7 7c0 3 1.6 4.6 2 6h10c.4-1.4 2-3 2-6a7 7 0 0 0-7-7z"/><path d="M9 19v2M12 19v2M15 19v2"/></svg>
        FATALITY
      </button>
    </div>

    <div class="actionCluster">
      <button class="actionBtn" id="light" aria-label="Light attack">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h11M13 6l6 6-6 6"/></svg>
        <span class="lbl">LIGHT</span>
      </button>
      <button class="actionBtn" id="heavy" aria-label="Heavy attack">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h9M9 5l8 7-8 7"/></svg>
        <span class="lbl">HEAVY</span>
      </button>
      <button class="actionBtn" id="grab" aria-label="Grab">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6a2 2 0 1 1 4 0v4M11 10V5a2 2 0 1 1 4 0v5M15 10.5V7a2 2 0 1 1 4 0v6c0 3.5-2.5 6-6.5 6C9 19 7 17 6 15l-2-4c-.4-.9.6-1.8 1.4-1.2L7 11.5"/></svg>
        <span class="lbl">GRAB</span>
      </button>
      <button class="actionBtn" id="block" aria-label="Block">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>
        <span class="lbl">BLOCK</span>
      </button>
    </div>
  </div>

  <div id="message"></div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
